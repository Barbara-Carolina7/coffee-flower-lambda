
name: Deploy Coffee Flower Report Lambda

on:
  push:
    branches:
      - main
    paths:
      - "src/report.handler.js"
      - "src/report.service.js"
      - "src/product.repository.js"
      - "src/notifier.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-report-lambda.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-report:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar archivos JavaScript
        run: |
          node --check src/report.handler.js
          node --check src/report.service.js
          node --check src/product.repository.js
          node --check src/notifier.js

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Preparar paquete
        run: |
          npm ci --omit=dev
          zip -r report-function.zip \
            src/report.handler.js \
            src/report.service.js \
            src/product.repository.js \
            src/notifier.js \
            package.json \
            package-lock.json \
            node_modules

      - name: Desplegar código de la Lambda de informes
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_REPORT_FUNCTION_NAME }}" \
            --zip-file fileb://report-function.zip

      - name: Esperar actualización
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_REPORT_FUNCTION_NAME }}"
